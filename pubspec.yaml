name: fitmate
description: "A new Flutter project."

publish_to: 'none' # 


version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
