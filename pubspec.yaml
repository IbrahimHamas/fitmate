name: fitmate
description: "A new Flutter project."


publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1

  equatable: ^3.0.0
  image_picker: ^1.2.3
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Lexend-OFL.txt
    - assets/images/splash/
    - assets/images/welcome/
    - assets/images/plans/
    - assets/svgs/

  fonts:
    - family: Lexend
      fonts:

        - asset: assets/fonts/Lexend-Variable.ttf
